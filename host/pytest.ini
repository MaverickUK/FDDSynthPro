[pytest]
testpaths = tests
# Plain `pytest` runs only what needs no hardware; `-m sliceN` overrides this.
addopts = -m sim
markers =
    sim: runs without hardware (simulators, parsers)
    slice0: listen only
    slice1: head position, index and status lines
    slice2: read a generated disk
    slice3: images on SD
    slice4: activity events for the sounds
    slice5: write
    slice6: a real PC, disk swaps and soak
    amiga: Amiga tracks, with the Feather reaching them in Shugart mode
    formats: other disk formats, each read back with Greaseweazle's definition
    soak: hours of random reads, writes, swaps and restarts (FDDPRO_SOAK_HOURS)
