# FDDSYNTH.CFG: the FDD Synth Pro's settings.
#
# Copy this file to the root folder of the drive's microSD card, and edit it
# there. One setting a line. Lines starting with # are notes: the drive
# ignores them, and leaves them out when it next saves the file.
#
# The drive keeps the disk (last), the sample pack and the volume up to date
# by itself. The rest only change when you edit them.

# The disk to start with, every time. Without it, the drive starts with the
# disk that was in last. Take the # off to use it.
#image=GAMES.IMG

# What the drive is on the cable. interface: ibmpc (a PC), shugart (most
# other machines: Atari ST, Amstrad, synths and samplers) or amiga.
interface=ibmpc

# ibmpc only: twisted if the drive is past the twist in a PC's cable (the
# end connector), straight if there's no twist.
cable=twisted

# Which drive this is: a, b, or a,b to be both A: and B: (ibmpc); ds0, ds1
# or ds2 (shugart); df0, df1 or df0,df1 (amiga).
drive=a

# The second drive's disk, with two drives. Take the # off to use it.
#image2=WORK.IMG

# The sound: 0 to 100.
volume=75
