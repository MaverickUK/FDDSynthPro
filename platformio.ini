; FDDSynthPro floppy drive emulator prototype (C++ / Arduino-Pico)
;
;   pio run                 build the default (slice 0) -> .pio/build/bb48/firmware.uf2
;   pio run -t upload       build + flash over USB (BOOTSEL or auto-reset)
;   pio run -e bb48_drive -t upload    the drive build (slices 1-5)
;   pio device monitor      serial console (115200)

[platformio]
default_envs = bb48

[env:bb48]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2bb48              ; the BB48R: RP2350B, 48 GPIO, 16 MB flash
board_upload.psram_length = 8388608   ; its 8 MB PSRAM: the disk image cache (image_cache.h)
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
; The test runner finds the serial port by this product name.
board_build.arduino.earlephilhower.usb_manufacturer = HDD Synth
board_build.arduino.earlephilhower.usb_product = FDDSynthPro
monitor_speed = 115200
build_flags =
    -O2
    -Wall

; The drive (slices 1-5): head position, TRK00, 300 RPM index, WPT, DSKCHG,
; RDATA from the first 720 KB or 1.44 MB image on the SD card (or a
; generated disk), writes back to that image, answering on pins 12/16 (a PC
; drive's own select/motor), and ACT lines: the sound events for the FDD Synth.
[env:bb48_drive]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=5

; The same two builds with the outputs wired straight to the header, no
; SN7407 (config.h: OUTPUTS_OPEN_DRAIN). For the FeatherWing host only, never
; a real PC. The READY line ends in "direct".
[env:bb48_direct]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFDD_OUTPUTS_OPEN_DRAIN=1

[env:bb48_drive_direct]
extends = env:bb48
build_flags =
    ${env:bb48.build_flags}
    -DFIRMWARE_SLICE=5
    -DFDD_OUTPUTS_OPEN_DRAIN=1
